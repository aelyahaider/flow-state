<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6B5B95">
    <meta name="description" content="Flow State - Personal wellness tracking app">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flow State">
    <link rel="manifest" href="manifest.json">
    <title>Flow State</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #F5F0E8;
            color: #4A4A4A;
        }

        #root {
            height: 100%;
        }

        input, select, textarea {
            font-size: 16px !important;
        }

        body {
            overscroll-behavior-y: contain;
        }

        .tab-content {
            min-height: 400px;
        }

        .serif {
            font-family: Georgia, serif;
        }

        .purple-900 { color: #3E3B52; }
        .purple-700 { color: #6B5B95; }
        .purple-600 { color: #8B7BB9; }
        .purple-400 { color: #B8B3D9; }
        .purple-200 { color: #E8DDF5; }
        .purple-100 { color: #F3EBF9; }
        .purple-50 { color: #F8F5FC; }

        .bg-amber-50 { background-color: #F5F0E8; }
        .bg-purple-700 { background-color: #6B5B95; }
        .bg-purple-100 { background-color: #F3EBF9; }
        .bg-purple-200 { background-color: #E8DDF5; }
        .bg-white { background-color: #ffffff; }
        .bg-red-100 { background-color: #FEE2E2; }

        .rounded-full { border-radius: 9999px; }
        .rounded-3xl { border-radius: 24px; }
        .rounded-2xl { border-radius: 16px; }
        .rounded-lg { border-radius: 8px; }

        .space-y-6 > * + * { margin-top: 24px; }
        .space-y-4 > * + * { margin-top: 16px; }
        .space-y-3 > * + * { margin-top: 12px; }
        .space-y-2 > * + * { margin-top: 8px; }

        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }

        .text-4xl { font-size: 36px; line-height: 1.2; }
        .text-3xl { font-size: 30px; line-height: 1.2; }
        .text-2xl { font-size: 24px; line-height: 1.3; }
        .text-lg { font-size: 18px; line-height: 1.5; }
        .text-base { font-size: 16px; }
        .text-sm { font-size: 14px; }
        .text-xs { font-size: 12px; }

        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }

        .flex { display: flex; }
        .grid { display: grid; }
        .grid-cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .justify-around { justify-content: space-around; }

        .p-3 { padding: 12px; }
        .p-4 { padding: 16px; }
        .p-6 { padding: 24px; }
        .p-8 { padding: 32px; }

        .px-4 { padding-left: 16px; padding-right: 16px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }

        .w-full { width: 100%; }
        .w-16 { width: 64px; }
        .w-6 { width: 24px; }
        .w-3 { width: 12px; }

        .h-16 { height: 64px; }
        .h-32 { height: 128px; }
        .h-3 { height: 12px; }

        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-6 { margin-bottom: 24px; }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }

        .border-2 { border-width: 2px; }
        .border-t-2 { border-top-width: 2px; }
        .border-purple-200 { border-color: #E8DDF5; }
        .border-purple-900 { border-color: #3E3B52; }
        .border-red-300 { border-color: #FCA5A5; }

        .inline-block { display: inline-block; }
        .block { display: block; }

        .hover\:bg-purple-200:hover { background-color: #E8DDF5; }
        .hover\:bg-purple-800:hover { background-color: #5A4A84; }
        .hover\:text-purple-600:hover { color: #8B7BB9; }

        .transition { transition: all 0.2s; }

        .focus\:border-purple-500:focus { border-color: #7C6DB5; }
        .focus\:outline-none:focus { outline: none; }

        .text-center { text-align: center; }
        .text-left { text-align: left; }

        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .top-16 { top: 64px; }
        .top-0 { top: 0; }
        .right-0 { right: 0; }
        .bottom-0 { bottom: 0; }
        .left-0 { left: 0; }

        .z-50 { z-index: 50; }

        .max-w-md { max-width: 448px; }
        .mx-auto { margin-left: auto; margin-right: auto; }

        .pt-4 { padding-top: 16px; }
        .pb-24 { padding-bottom: 96px; }

        .relative { position: relative; }

        button {
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
        }

        input, select {
            border: none;
            padding: 12px;
            font-family: inherit;
        }

        textarea {
            border: none;
            font-family: inherit;
        }

        .line-through { text-decoration: line-through; }

        .h-32 { height: 128px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        const FlowState = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [showQuickActions, setShowQuickActions] = useState(false);
            const [name, setName] = useState('');
            const [showNameInput, setShowNameInput] = useState(false);

            // Period
            const [periodData, setPeriodData] = useState(() => {
                const saved = localStorage.getItem('periodData');
                return saved ? JSON.parse(saved) : { cycles: [], symptoms: {} };
            });

            // Sleep
            const [sleepData, setSleepData] = useState(() => {
                const saved = localStorage.getItem('sleepData');
                return saved ? JSON.parse(saved) : {};
            });

            // Calendar
            const [events, setEvents] = useState(() => {
                const saved = localStorage.getItem('events');
                return saved ? JSON.parse(saved) : [];
            });

            // Prayers
            const [prayers, setPrayers] = useState(() => {
                const saved = localStorage.getItem('prayers');
                return saved ? JSON.parse(saved) : {};
            });

            // Chores
            const [chores, setChores] = useState(() => {
                const saved = localStorage.getItem('chores');
                return saved ? JSON.parse(saved) : [];
            });

            // Expenses
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('expenses');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                const savedName = localStorage.getItem('userName');
                if (savedName) setName(savedName);
            }, []);

            const handleNameSave = (newName) => {
                setName(newName);
                localStorage.setItem('userName', newName);
                setShowNameInput(false);
            };

            // Period functions
            const logPeriod = (date) => {
                const newCycle = { startDate: date.toISOString(), symptoms: {} };
                const updated = [...periodData.cycles, newCycle];
                setPeriodData({ ...periodData, cycles: updated });
                localStorage.setItem('periodData', JSON.stringify({ ...periodData, cycles: updated }));
            };

            const getPeriodInfo = () => {
                if (periodData.cycles.length === 0) return null;
                const lastCycle = new Date(periodData.cycles[periodData.cycles.length - 1].startDate);
                const today = new Date();
                const daysSince = Math.floor((today - lastCycle) / (1000 * 60 * 60 * 24));
                return { lastCycle, daysSince, cycleDay: daysSince + 1 };
            };

            const getPeriodPhase = () => {
                const info = getPeriodInfo();
                if (!info) return 'unknown';
                const day = info.cycleDay;
                if (day <= 5) return 'menstruation';
                if (day <= 11) return 'follicular';
                if (day <= 16) return 'ovulation';
                return 'luteal';
            };

            const getPhaseEmoji = () => {
                const phase = getPeriodPhase();
                const emojis = {
                    menstruation: '🩸',
                    follicular: '🌱',
                    ovulation: '🌸',
                    luteal: '🌙'
                };
                return emojis[phase] || '🌙';
            };

            // Sleep functions
            const logSleep = (date, bedtime, waketime) => {
                const dateStr = date.toISOString().split('T')[0];
                const bed = new Date(`2000-01-01 ${bedtime}`);
                const wake = new Date(`2000-01-02 ${waketime}`);
                const hours = (wake - bed) / (1000 * 60 * 60);
                
                const updated = {
                    ...sleepData,
                    [dateStr]: { bedtime, waketime, hours: parseFloat(hours.toFixed(1)) }
                };
                setSleepData(updated);
                localStorage.setItem('sleepData', JSON.stringify(updated));
            };

            const getWeekSleep = () => {
                const week = [];
                for (let i = 6; i >= 0; i--) {
                    const date = new Date();
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toISOString().split('T')[0];
                    week.push(sleepData[dateStr]?.hours || 0);
                }
                return week;
            };

            // Calendar functions
            const addEvent = (date, title, category) => {
                const newEvent = {
                    id: Date.now(),
                    date: date.toISOString().split('T')[0],
                    title,
                    category
                };
                setEvents([...events, newEvent]);
                localStorage.setItem('events', JSON.stringify([...events, newEvent]));
            };

            const getTodayEvents = () => {
                const today = new Date().toISOString().split('T')[0];
                return events.filter(e => e.date === today);
            };

            // Prayer functions
            const logPrayer = (date, prayer) => {
                const dateStr = date.toISOString().split('T')[0];
                const updated = {
                    ...prayers,
                    [dateStr]: {
                        ...prayers[dateStr],
                        [prayer]: true
                    }
                };
                setPrayers(updated);
                localStorage.setItem('prayers', JSON.stringify(updated));
            };

            const getPrayerCount = () => {
                const today = new Date().toISOString().split('T')[0];
                const todayPrayers = prayers[today] || {};
                return Object.values(todayPrayers).filter(v => v).length;
            };

            // Chore functions
            const addChore = (title, frequency) => {
                const newChore = {
                    id: Date.now(),
                    title,
                    frequency,
                    completed: false
                };
                setChores([...chores, newChore]);
                localStorage.setItem('chores', JSON.stringify([...chores, newChore]));
            };

            const toggleChore = (id) => {
                const updated = chores.map(c => c.id === id ? { ...c, completed: !c.completed } : c);
                setChores(updated);
                localStorage.setItem('chores', JSON.stringify(updated));
            };

            // Budget functions
            const addExpense = (category, amount, date) => {
                const newExpense = {
                    id: Date.now(),
                    category,
                    amount,
                    date: date.toISOString().split('T')[0]
                };
                setExpenses([...expenses, newExpense]);
                localStorage.setItem('expenses', JSON.stringify([...expenses, newExpense]));
            };

            const getMonthlyExpenses = () => {
                const today = new Date();
                const currentMonth = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
                return expenses.filter(e => e.date.startsWith(currentMonth));
            };

            const getMonthlyByCategory = () => {
                const monthly = getMonthlyExpenses();
                const byCategory = {};
                monthly.forEach(e => {
                    byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
                });
                return byCategory;
            };

            const getTotalMonthly = () => {
                return getMonthlyExpenses().reduce((sum, e) => sum + e.amount, 0);
            };

            // Render functions
            const renderHome = () => (
                React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'flex justify-between items-center' },
                        React.createElement('div', null,
                            React.createElement('h1', { className: 'text-4xl serif purple-900' }, `Hello, ${name || '[name]'}`),
                            React.createElement('p', { className: 'purple-600 text-sm mt-1' }, 
                                new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
                            )
                        ),
                        React.createElement('div', { className: 'w-16 h-16 bg-purple-200 rounded-full' })
                    ),
                    React.createElement('div', { className: 'bg-white rounded-3xl p-6 shadow-sm text-center' },
                        React.createElement('div', { className: 'inline-block text-6xl mb-4' }, getPhaseEmoji()),
                        getPeriodInfo() ? React.createElement(React.Fragment, null,
                            React.createElement('h2', { className: 'text-3xl serif purple-900' }, `Day ${getPeriodInfo().cycleDay}`),
                            React.createElement('p', { className: 'purple-600 capitalize' }, getPeriodPhase().replace(/([A-Z])/g, ' $1'))
                        ) : React.createElement('p', { className: 'purple-600' }, 'Log your first period')
                    ),
                    React.createElement('div', { className: 'grid grid-cols-2 gap-4' },
                        React.createElement('div', { className: 'bg-purple-100 rounded-2xl p-4' },
                            React.createElement('p', { className: 'purple-900 text-sm font-semibold' }, 'Sleep'),
                            React.createElement('p', { className: 'text-2xl serif purple-900' }, sleepData[new Date().toISOString().split('T')[0]]?.hours || '—', ' hrs')
                        ),
                        React.createElement('div', { className: 'bg-purple-100 rounded-2xl p-4' },
                            React.createElement('p', { className: 'purple-900 text-sm font-semibold' }, 'Prayers'),
                            React.createElement('p', { className: 'text-2xl serif purple-900' }, getPrayerCount(), '/5')
                        ),
                        React.createElement('div', { className: 'bg-purple-100 rounded-2xl p-4' },
                            React.createElement('p', { className: 'purple-900 text-sm font-semibold' }, 'Spending'),
                            React.createElement('p', { className: 'text-2xl serif purple-900' }, '$', getTotalMonthly())
                        ),
                        React.createElement('div', { className: 'bg-purple-100 rounded-2xl p-4' },
                            React.createElement('p', { className: 'purple-900 text-sm font-semibold' }, 'Events'),
                            React.createElement('p', { className: 'text-2xl serif purple-900' }, getTodayEvents().length)
                        )
                    ),
                    getTodayEvents().length > 0 && React.createElement('div', null,
                        React.createElement('h3', { className: 'text-lg serif purple-900 mb-3' }, "Today's Events"),
                        React.createElement('div', { className: 'space-y-2' },
                            getTodayEvents().map(event =>
                                React.createElement('div', { key: event.id, className: 'bg-purple-100 rounded-2xl p-3 flex items-center gap-2' },
                                    React.createElement('div', { className: 'w-3 h-3 rounded-full', style: { backgroundColor: '#8B7BB9' } }),
                                    React.createElement('span', { className: 'purple-900 font-medium' }, event.title)
                                )
                            )
                        )
                    )
                )
            );

            const renderPeriod = () => (
                React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'text-center bg-white rounded-3xl p-8' },
                        React.createElement('div', { className: 'inline-block text-6xl mb-4' }, getPhaseEmoji()),
                        getPeriodInfo() ? React.createElement(React.Fragment, null,
                            React.createElement('h2', { className: 'text-4xl serif purple-900' }, `Day ${getPeriodInfo().cycleDay}`),
                            React.createElement('p', { className: 'purple-600 capitalize mt-2' }, getPeriodPhase().replace(/([A-Z])/g, ' $1'))
                        ) : React.createElement('p', { className: 'purple-600' }, 'No cycles logged yet')
                    ),
                    getPeriodInfo() && React.createElement(React.Fragment, null,
                        React.createElement('button', {
                            onClick: () => logPeriod(new Date()),
                            className: 'w-full bg-purple-700 hover:bg-purple-800 text-white rounded-full py-3 serif text-lg transition'
                        }, 'Log Period'),
                        React.createElement('div', { className: 'space-y-3' },
                            React.createElement('h3', { className: 'serif purple-900 text-lg' }, 'Symptoms'),
                            ['Cramps', 'Bloating', 'Mood Swings', 'Headache', 'Fatigue', 'Nausea'].map(symptom =>
                                React.createElement('button', {
                                    key: symptom,
                                    onClick: () => console.log('Symptom logged'),
                                    className: 'w-full bg-purple-100 hover:bg-purple-200 rounded-2xl p-4 text-left serif purple-900 transition flex justify-between items-center'
                                },
                                    React.createElement('span', null, symptom),
                                    React.createElement('span', { style: { color: '#FBBF24' } }, '●')
                                )
                            )
                        )
                    )
                )
            );

            const renderCalendar = () => {
                const [selectedDate, setSelectedDate] = React.useState(new Date());
                const [eventTitle, setEventTitle] = React.useState('');
                const [eventCategory, setEventCategory] = React.useState('Classes');

                const getDaysInMonth = (date) => {
                    return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
                };

                const getFirstDayOfMonth = (date) => {
                    return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
                };

                return React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'bg-white rounded-2xl p-4' },
                        React.createElement('div', { className: 'text-center mb-4' },
                            React.createElement('h2', { className: 'serif purple-900 text-lg' }, 
                                selectedDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
                            )
                        ),
                        React.createElement('div', { className: 'grid grid-cols-7 gap-2 mb-4' },
                            ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(day =>
                                React.createElement('div', { key: day, className: 'text-center purple-600 text-sm font-semibold' }, day)
                            ),
                            Array.from({ length: getFirstDayOfMonth(selectedDate) }).map((_, i) =>
                                React.createElement('div', { key: `empty-${i}` })
                            ),
                            Array.from({ length: getDaysInMonth(selectedDate) }).map((_, i) =>
                                React.createElement('button', {
                                    key: i + 1,
                                    onClick: () => setSelectedDate(new Date(selectedDate.getFullYear(), selectedDate.getMonth(), i + 1)),
                                    className: i + 1 === selectedDate.getDate() ? 'p-2 rounded-lg text-sm serif bg-purple-700 text-white transition' : 'p-2 rounded-lg text-sm serif purple-900 hover:bg-purple-100 transition'
                                }, i + 1)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('input', {
                            type: 'text',
                            value: eventTitle,
                            onChange: (e) => setEventTitle(e.target.value),
                            placeholder: 'Event title',
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        }),
                        React.createElement('select', {
                            value: eventCategory,
                            onChange: (e) => setEventCategory(e.target.value),
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        },
                            ['Classes', 'Friends', 'ECAs', 'Sports', 'Personal', 'Family'].map(cat =>
                                React.createElement('option', { key: cat, value: cat }, cat)
                            )
                        ),
                        React.createElement('button', {
                            onClick: () => {
                                if (eventTitle) {
                                    addEvent(selectedDate, eventTitle, eventCategory);
                                    setEventTitle('');
                                }
                            },
                            className: 'w-full bg-purple-700 hover:bg-purple-800 text-white rounded-full py-3 serif transition'
                        }, 'Add Event')
                    )
                );
            };

            const renderSleep = () => {
                const [bedtime, setBedtime] = React.useState('22:00');
                const [waketime, setWaketime] = React.useState('07:00');
                const weekData = getWeekSleep();

                return React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('label', { className: 'block' },
                            React.createElement('span', { className: 'purple-900 serif mb-2 block' }, 'Bedtime'),
                            React.createElement('input', {
                                type: 'time',
                                value: bedtime,
                                onChange: (e) => setBedtime(e.target.value),
                                className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none'
                            })
                        ),
                        React.createElement('label', { className: 'block' },
                            React.createElement('span', { className: 'purple-900 serif mb-2 block' }, 'Wake time'),
                            React.createElement('input', {
                                type: 'time',
                                value: waketime,
                                onChange: (e) => setWaketime(e.target.value),
                                className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none'
                            })
                        ),
                        React.createElement('button', {
                            onClick: () => logSleep(new Date(), bedtime, waketime),
                            className: 'w-full bg-purple-700 hover:bg-purple-800 text-white rounded-full py-3 serif transition'
                        }, 'Log Sleep')
                    ),
                    React.createElement('div', { className: 'bg-white rounded-2xl p-6' },
                        React.createElement('h3', { className: 'serif purple-900 mb-4' }, 'This Week'),
                        React.createElement('div', { className: 'flex items-end gap-2 h-32 justify-center' },
                            weekData.map((hours, i) =>
                                React.createElement('div', { key: i, className: 'flex flex-col items-center gap-2' },
                                    React.createElement('div', {
                                        className: 'w-6 bg-purple-400 rounded-t-lg transition',
                                        style: { height: `${Math.max(hours * 10, 4)}px` }
                                    }),
                                    React.createElement('span', { className: 'purple-600 text-xs font-semibold' }, ['M', 'T', 'W', 'T', 'F', 'S', 'S'][i])
                                )
                            )
                        ),
                        React.createElement('p', { className: 'text-center purple-600 text-sm mt-4' }, 
                            `Average: ${(weekData.reduce((a, b) => a + b, 0) / 7).toFixed(1)} hrs`
                        )
                    )
                );
            };

            const renderPrayers = () => {
                const prayerList = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                const today = new Date().toISOString().split('T')[0];
                const todayPrayers = prayers[today] || {};
                const periodInfo = getPeriodInfo();
                const isDuringPeriod = periodInfo && periodInfo.cycleDay <= 5;

                return React.createElement('div', { className: 'space-y-6' },
                    isDuringPeriod && React.createElement('div', { className: 'bg-red-100 border-2 border-red-300 rounded-2xl p-4 text-center' },
                        React.createElement('p', { className: 'purple-900 serif' }, 'No prayers to log during menstruation')
                    ),
                    React.createElement('div', { className: 'space-y-3' },
                        !isDuringPeriod && prayerList.map(prayer =>
                            React.createElement('button', {
                                key: prayer,
                                onClick: () => logPrayer(new Date(), prayer),
                                className: todayPrayers[prayer] ? 'w-full rounded-2xl p-4 serif text-lg transition bg-purple-700 text-white' : 'w-full rounded-2xl p-4 serif text-lg transition bg-purple-100 purple-900 hover:bg-purple-200'
                            }, prayer, ' ', todayPrayers[prayer] && '✓')
                        )
                    )
                );
            };

            const renderChores = () => {
                const [choreTitle, setChoreTitle] = React.useState('');
                const [choreFreq, setChoreFreq] = React.useState('Weekly');

                return React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('input', {
                            type: 'text',
                            value: choreTitle,
                            onChange: (e) => setChoreTitle(e.target.value),
                            placeholder: 'Chore name',
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        }),
                        React.createElement('select', {
                            value: choreFreq,
                            onChange: (e) => setChoreFreq(e.target.value),
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        },
                            React.createElement('option', null, 'Daily'),
                            React.createElement('option', null, 'Weekly'),
                            React.createElement('option', null, 'Bi-weekly')
                        ),
                        React.createElement('button', {
                            onClick: () => {
                                if (choreTitle) {
                                    addChore(choreTitle, choreFreq);
                                    setChoreTitle('');
                                }
                            },
                            className: 'w-full bg-purple-700 hover:bg-purple-800 text-white rounded-full py-3 serif transition'
                        }, 'Add Chore')
                    )
                );
            };

            const renderBudget = () => {
                const [amount, setAmount] = React.useState('');
                const [category, setCategory] = React.useState('Food');
                const byCategory = getMonthlyByCategory();

                return React.createElement('div', { className: 'space-y-6' },
                    React.createElement('div', { className: 'space-y-3' },
                        React.createElement('input', {
                            type: 'number',
                            value: amount,
                            onChange: (e) => setAmount(e.target.value),
                            placeholder: 'Amount',
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        }),
                        React.createElement('select', {
                            value: category,
                            onChange: (e) => setCategory(e.target.value),
                            className: 'w-full rounded-2xl p-3 border-2 border-purple-200 focus:border-purple-500 outline-none serif'
                        },
                            ['Food', 'Utilities', 'Grocery', 'Miscellaneous'].map(cat =>
                                React.createElement('option', { key: cat, value: cat }, cat)
                            )
                        ),
                        React.createElement('button', {
                            onClick: () => {
                                if (amount) {
                                    addExpense(category, parseFloat(amount), new Date());
                                    setAmount('');
                                }
                            },
                            className: 'w-full bg-purple-700 hover:bg-purple-800 text-white rounded-full py-3 serif transition'
                        }, 'Add Expense')
                    ),
                    React.createElement('div', { className: 'bg-white rounded-2xl p-6 text-center' },
                        React.createElement('p', { className: 'purple-600 text-sm' }, 'Total this month'),
                        React.createElement('p', { className: 'text-4xl serif purple-900' }, '$', getTotalMonthly())
                    )
                );
            };

            const quickActionItems = [
                { label: 'Log Period', action: () => { logPeriod(new Date()); setShowQuickActions(false); } },
                { label: 'Log Sleep', action: () => { setActiveTab('sleep'); setShowQuickActions(false); } },
                { label: 'Add Event', action: () => { setActiveTab('calendar'); setShowQuickActions(false); } },
                { label: 'Log Prayer', action: () => { setActiveTab('prayers'); setShowQuickActions(false); } },
                { label: 'Add Expense', action: () => { setActiveTab('budget'); setShowQuickActions(false); } },
                { label: 'Add Chore', action: () => { setActiveTab('chores'); setShowQuickActions(false); } }
            ];

            return React.createElement('div', { className: 'min-h-screen bg-amber-50' },
                React.createElement('div', { className: 'max-w-md mx-auto pb-24 pt-4 px-4' },
                    React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                        React.createElement('div', { className: 'flex-1' },
                            showNameInput ? 
                                React.createElement('input', {
                                    type: 'text',
                                    autoFocus: true,
                                    defaultValue: name,
                                    onBlur: (e) => handleNameSave(e.target.value),
                                    onKeyPress: (e) => e.key === 'Enter' && handleNameSave(e.target.value),
                                    className: 'text-2xl serif purple-900 bg-transparent border-b-2 border-purple-900 outline-none'
                                })
                            : React.createElement('button', {
                                onClick: () => setShowNameInput(true),
                                className: 'text-2xl serif purple-900 hover:text-purple-600'
                            }, name ? name : 'Set your name')
                        ),
                        React.createElement('div', { className: 'relative' },
                            React.createElement('button', {
                                onClick: () => setShowQuickActions(!showQuickActions),
                                className: 'bg-purple-700 hover:bg-purple-800 text-white rounded-full p-3 transition'
                            }, '+'),
                            showQuickActions && React.createElement('div', { className: 'absolute top-16 right-0 bg-white rounded-2xl shadow-lg p-3 w-48 z-50' },
                                React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
                                    quickActionItems.map(item =>
                                        React.createElement('button', {
                                            key: item.label,
                                            onClick: item.action,
                                            className: 'bg-purple-100 hover:bg-purple-200 purple-900 rounded-lg p-3 text-sm serif transition'
                                        }, item.label)
                                    )
                                )
                            )
                        )
                    ),
                    React.createElement('div', { className: 'min-h-96 tab-content' },
                        activeTab === 'home' && renderHome(),
                        activeTab === 'period' && renderPeriod(),
                        activeTab === 'calendar' && renderCalendar(),
                        activeTab === 'sleep' && renderSleep(),
                        activeTab === 'prayers' && renderPrayers(),
                        activeTab === 'chores' && renderChores(),
                        activeTab === 'budget' && renderBudget()
                    )
                ),
                React.createElement('div', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t-2 border-purple-200' },
                    React.createElement('div', { className: 'max-w-md mx-auto flex justify-around' },
                        [
                            { id: 'home', label: '🏠 Home' },
                            { id: 'period', label: '❤️ Period' },
                            { id: 'calendar', label: '📅 Cal' },
                            { id: 'sleep', label: '🌙 Sleep' },
                            { id: 'prayers', label: '🙏 Pray' },
                            { id: 'budget', label: '💰 Bud' }
                        ].map(tab =>
                            React.createElement('button', {
                                key: tab.id,
                                onClick: () => setActiveTab(tab.id),
                                className: activeTab === tab.id ? 'flex-1 py-4 flex flex-col items-center gap-1 transition purple-700 bg-purple-50' : 'flex-1 py-4 flex flex-col items-center gap-1 transition purple-400 hover:purple-600'
                            }, 
                            React.createElement('span', { className: 'text-xs font-semibold' }, tab.label)
                            )
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(FlowState));
    </script>
</body>
</html>
