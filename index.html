<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6B5B95">
    <meta name="description" content="Flow State - Personal wellness tracking app for LUMS students">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flow State">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%236B5B95' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='serif' font-weight='bold'>FS</text></svg>">
    <link rel="manifest" href="manifest.json">
    <title>Flow State</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #F5F0E8;
            color: #4A4A4A;
        }

        html, body, #root {
            height: 100%;
            width: 100%;
        }

        /* Prevent zoom on input focus for iOS */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Prevent pull-to-refresh on iOS */
        body {
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import FlowState from './flow-state-app.jsx';

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(FlowState));
    </script>
</body>
</html>
