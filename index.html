<style>
  :root{
    --cream:#FBF4DD;
    --cream-soft:#F6EFD6;
    --purple:#696199;
    --purple-strong:#5B5387;
    --lavender:#C7B5DC;
    --lavender-deep:#B39FCE;
    --badge:#EDE6E2;
    --blob:#F6E3F3;
    --green:#B1D8B7;
    --green-deep:#7FB98A;
    --yellow:#F2E88A;
    --yellow-deep:#D8C452;
    --blue:#A7C4E0;
    --blue-deep:#7FA6C9;
    --shadow: 0 10px 22px rgba(105,97,153,0.28);
    --shadow-soft: 0 6px 16px rgba(105,97,153,0.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--cream);
    color:var(--purple);
    font-family:'Playfair Display', Georgia, serif;
    overscroll-behavior-y: none;
    height:100%;
  }

  button, input, textarea{ font-family: inherit; }

  #root{
    min-height:100%;
  }

  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--cream);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  .screen{
    flex:1;
    padding: calc(env(safe-area-inset-top) + 22px) 24px 20px 24px;
    padding-bottom: 110px;
    overflow-y:auto;
  }

  /* ---------- Header ---------- */
  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .greeting{
    font-size:34px;
    line-height:1.1;
    margin:0;
    font-weight:600;
    color:var(--purple);
  }
  .greeting b{ font-weight:800; }
  .avatar-btn{
    width:56px; height:56px; min-width:56px;
    border-radius:50%;
    background:var(--badge);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:6px;
    margin-top:2px;
    overflow:hidden;
  }
  .avatar-img{ width:100%; height:100%; object-fit:contain; display:block; }

  .date-line{
    margin-top:10px;
    font-size:20px;
    color:var(--purple);
    font-weight:600;
  }
  .date-line sup{ font-size:12px; top:-0.6em; }

  /* ---------- Week nav + strip ---------- */
  .week-nav-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:26px;
  }
  .week-nav-btn{
    width:30px; height:30px; border-radius:50%;
    border:1.5px solid var(--lavender-deep);
    background:transparent; color:var(--purple);
    font-size:16px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1; padding:0;
  }
  .week-nav-btn:disabled{ opacity:0.3; cursor:default; }
  .week-range-label{
    font-family:'Caveat', cursive;
    font-size:19px; font-weight:700; color:var(--lavender-deep);
  }
  .week-strip{
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    gap:4px;
  }
  .day-col{
    display:flex; flex-direction:column; align-items:center;
    gap:10px;
    background:none; border:none; padding:0; cursor:pointer;
    flex:1;
  }
  .day-letter{
    font-size:19px;
    font-weight:700;
    color:var(--purple);
    opacity:0.85;
  }
  .day-letter.is-today{
    font-family:'Caveat', cursive;
    font-style:italic;
    font-size:22px;
    font-weight:700;
    color:var(--lavender-deep);
    opacity:1;
  }
  .day-badge{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--badge);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    font-weight:700;
    color:var(--purple);
    border:2px solid transparent;
    transition: border-color .15s ease, transform .15s ease;
  }
  .day-badge.is-selected{
    border-color:var(--purple);
    transform:scale(1.05);
  }
  .day-badge.has-log{
    background:var(--lavender);
  }

  /* ---------- Cycle ring ---------- */
  .ring-wrap{
    margin:34px auto 0 auto;
    width:280px; height:280px;
    border-radius:50%;
    border:2.5px solid var(--purple);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:44px;
    position:relative;
    background:transparent;
    overflow:hidden;
  }
  .ring-day{
    font-size:44px;
    font-weight:800;
    margin:0;
    letter-spacing:1px;
  }
  .ring-phase{
    margin-top:6px;
    font-size:14px;
    font-weight:700;
    letter-spacing:3px;
    color:var(--lavender-deep);
  }
  .blob-dock{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:186px; height: 116px;
    overflow:visible;
  }

  /* ---------- Log period button ---------- */
  .log-btn{
    display:block;
    width:100%;
    margin-top:38px;
    padding:18px 20px;
    background:var(--purple);
    color:var(--cream);
    border:none;
    border-radius:32px;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:19px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition: transform .1s ease, box-shadow .1s ease, opacity .15s ease;
  }
  .log-btn:active{ transform:translateY(2px); box-shadow:var(--shadow-soft); }
  .log-btn.is-logged{
    background:var(--lavender);
    color:var(--purple);
  }

  .confirm-box{
    margin-top:14px;
    background:var(--cream-soft);
    border:1.5px dashed var(--lavender-deep);
    border-radius:20px;
    padding:16px 18px;
    text-align:center;
  }
  .confirm-box p{ margin:0 0 12px 0; font-size:16px; font-weight:600; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{
    flex:1;
    border-radius:20px;
    padding:10px 12px;
    border:none;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .confirm-yes{ background:var(--purple); color:var(--cream); }
  .confirm-no{ background:transparent; color:var(--purple); border:1.5px solid var(--purple) !important; }

  /* ---------- Section headers ---------- */
  .section-title{
    margin:36px 0 14px 0;
    font-size:22px;
    font-weight:700;
    color:var(--purple);
  }

  /* ---------- Predicted symptoms ---------- */
  .predicted-caption{
    font-family:'Caveat', cursive;
    font-size:19px;
    color:var(--lavender-deep);
    font-weight:700;
    margin:0 0 10px 0;
  }
  .predicted-row{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:24px;
  }
  .predicted-chip{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px 9px 10px;
    border-radius:20px;
    border:1.5px dashed var(--lavender-deep);
    background:transparent;
    color:var(--purple);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .predicted-plus{
    width:18px; height:18px; border-radius:50%;
    background:var(--lavender);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:var(--purple);
    line-height:1;
  }

  .ask-line{
    font-size:17px;
    font-weight:700;
    color:var(--purple);
    margin:4px 0 12px 0;
  }

  /* ---------- Symptom cards ---------- */
  .symptom-card{
    background:var(--lavender);
    border-radius:26px;
    padding:22px 20px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    box-shadow:var(--shadow-soft);
    position:relative;
  }
  .symptom-name{
    font-size:26px;
    font-weight:700;
    color:var(--purple);
    flex:1;
    padding-right:14px;
    line-height:1.15;
    word-break:break-word;
  }
  .symptom-divider{
    width:1.5px; align-self:stretch;
    background:var(--purple);
    opacity:0.55;
    margin:0 14px;
    min-height:34px;
  }
  .symptom-intensity{
    display:flex; align-items:center; gap:8px;
    min-width:64px;
    justify-content:flex-end;
  }
  .dot{ width:12px; height:12px; border-radius:50%; }
  .dot.high{ background:var(--green); }
  .dot.mid{ background:var(--yellow); }
  .dot.low{ background:var(--blue); }
  .intensity-word{
    font-family:'Caveat', cursive;
    font-size:22px;
    font-weight:700;
    color:var(--purple);
  }
  .remove-x{
    position:absolute;
    top:10px; right:12px;
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:rgba(105,97,153,0.16);
    color:var(--purple);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }

  .empty-state{
    background:var(--cream-soft);
    border:1.5px dashed var(--lavender-deep);
    border-radius:22px;
    padding:26px 20px;
    text-align:center;
    color:var(--purple);
    margin-bottom:22px;
  }
  .empty-state p{ margin:0 0 4px 0; font-size:17px; font-weight:600; }
  .empty-state span{ font-family:'Caveat', cursive; font-size:17px; color:var(--lavender-deep); }

  .add-symptom-btn{
    width:100%;
    margin-top:4px;
    padding:16px;
    border-radius:24px;
    border:2px dashed var(--lavender-deep);
    background:transparent;
    color:var(--purple);
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
  }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(91,83,135,0.35);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%; max-width:480px;
    background:var(--cream);
    border-radius:28px 28px 0 0;
    padding:22px 24px calc(env(safe-area-inset-bottom) + 24px) 24px;
    max-height:82vh;
    overflow-y:auto;
    box-shadow: 0 -10px 30px rgba(105,97,153,0.35);
  }
  .sheet-handle{
    width:44px; height:5px; border-radius:4px;
    background:var(--lavender-deep);
    margin:0 auto 16px auto;
    opacity:0.6;
  }
  .sheet-title-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .sheet-title{ font-size:24px; font-weight:700; margin:0; }
  .sheet-close{
    width:32px; height:32px; border-radius:50%;
    border:none; background:var(--badge); color:var(--purple);
    font-size:16px; font-weight:700; cursor:pointer;
  }
  .field-label{
    font-size:15px; font-weight:700; color:var(--purple); opacity:0.8;
    margin:18px 0 10px 0; text-transform:uppercase; letter-spacing:1.5px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{
    padding:10px 16px;
    border-radius:20px;
    background:var(--badge);
    border:1.5px solid transparent;
    color:var(--purple);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  .chip.selected{ background:var(--lavender); border-color:var(--purple); }
  .custom-row{ display:flex; gap:8px; margin-top:10px; }
  .custom-input{
    flex:1;
    padding:12px 16px;
    border-radius:18px;
    border:1.5px solid var(--lavender-deep);
    background:#fff;
    font-size:15px;
    color:var(--purple);
  }
  .custom-add{
    padding:0 18px;
    border-radius:18px;
    border:none;
    background:var(--purple);
    color:var(--cream);
    font-weight:700;
    cursor:pointer;
  }
  .intensity-chip-row{ display:flex; gap:10px; }
  .intensity-chip{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:14px 8px;
    border-radius:18px;
    background:var(--badge);
    border:1.5px solid transparent;
    cursor:pointer;
  }
  .intensity-chip .dot{ width:16px; height:16px; }
  .intensity-chip span{ font-family:'Caveat', cursive; font-size:19px; font-weight:700; color:var(--purple); }
  .intensity-chip.selected{ border-color:var(--purple); background:#fff; }

  .sheet-save{
    width:100%;
    margin-top:26px;
    padding:16px;
    border-radius:24px;
    border:none;
    background:var(--purple);
    color:var(--cream);
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .sheet-save:disabled{ opacity:0.4; box-shadow:none; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:var(--cream);
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding: 10px 8px calc(env(safe-area-inset-bottom) + 10px) 8px;
    border-top:1.5px solid rgba(105,97,153,0.15);
  }
  .nav-btn{
    background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:50px; height:42px;
    border-radius:14px;
    padding:0;
  }
  .nav-btn.active{ background:var(--lavender); }
  .nav-icon-img{
    height:23px;
    width:auto;
    max-width:32px;
    display:block;
    object-fit:contain;
  }

  /* ---------- Onboarding ---------- */
  .onboarding{
    flex:1;
    display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 40px) 28px 40px 28px;
  }
  .ob-eyebrow{
    font-family:'Caveat', cursive;
    font-size:22px;
    color:var(--lavender-deep);
    font-weight:700;
    margin:0 0 6px 0;
  }
  .ob-title{
    font-size:32px;
    font-weight:800;
    margin:0 0 14px 0;
    line-height:1.2;
  }
  .ob-sub{
    font-size:17px;
    line-height:1.5;
    color:var(--purple);
    opacity:0.85;
    margin:0 0 26px 0;
    font-weight:600;
  }
  .ob-input{
    width:100%;
    padding:18px 20px;
    border-radius:22px;
    border:1.5px solid var(--lavender-deep);
    background:#fff;
    font-size:19px;
    color:var(--purple);
    font-weight:700;
    margin-bottom:16px;
  }
  .ob-spacer{ flex:1; }
  .ob-actions{ display:flex; gap:12px; }
  .ob-btn{
    flex:1;
    padding:17px;
    border-radius:26px;
    border:none;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .ob-btn.primary{ background:var(--purple); color:var(--cream); }
  .ob-btn.primary:disabled{ opacity:0.4; box-shadow:none; }
  .ob-btn.ghost{ background:transparent; color:var(--purple); border:1.5px solid var(--purple); box-shadow:none; flex:0 0 auto; padding:17px 22px; }
  .ob-dots{ display:flex; gap:8px; margin-bottom:26px; }
  .ob-dot{ width:8px; height:8px; border-radius:50%; background:var(--badge); }
  .ob-dot.filled{ background:var(--purple); }

  .avatar-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:10px;
  }
  .avatar-option{
    background:var(--badge);
    border-radius:26px;
    border:3px solid transparent;
    padding:16px;
    cursor:pointer;
  }
  .avatar-option img{ width:100%; height:auto; display:block; }
  .avatar-option.selected{ border-color:var(--purple); background:#fff; }

  /* ---------- Coming soon ---------- */
  .coming-soon{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:14px;
    padding-bottom:60px;
  }
  .coming-soon .cs-blob{ width:150px; height:100px; }
  .coming-soon h2{ font-size:28px; margin:0; font-weight:800; }
  .coming-soon p{ font-family:'Caveat', cursive; font-size:20px; color:var(--lavender-deep); margin:0; font-weight:700; }

  /* ---------- Avatar menu ---------- */
  .avatar-menu-overlay{
    position:fixed; inset:0; z-index:60;
  }
  .avatar-menu{
    position:absolute;
    top: calc(env(safe-area-inset-top) + 84px);
    right: max(24px, calc((100vw - 480px)/2 + 24px));
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:14px 10px 10px 10px;
    min-width:210px;
  }
  .avatar-menu-name{
    margin:2px 6px 12px 6px;
    font-size:15px;
    font-weight:700;
    color:var(--purple);
  }
  .avatar-menu-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    padding:0 4px 12px 4px;
  }
  .avatar-menu-thumb{
    background:var(--cream-soft);
    border-radius:12px;
    border:2px solid transparent;
    padding:4px;
    cursor:pointer;
  }
  .avatar-menu-thumb img{ width:100%; display:block; }
  .avatar-menu-thumb.selected{ border-color:var(--purple); }
  .avatar-menu button.danger{
    width:100%;
    text-align:left;
    background:none; border:none;
    padding:12px 10px;
    font-size:15px;
    font-weight:700;
    color:#B25858;
    border-radius:10px;
    cursor:pointer;
  }
  .avatar-menu button.danger:hover{ background:var(--cream-soft); }

  @media (min-width:481px){
    body{ background:#EFE7CE; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ============================================================
   Image assets (hand-drawn nav icons + profile picture options)

/* ============================================================
   Storage + date utilities
   ============================================================ */
const STORAGE_KEY = 'flowstate_data_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}

const DAY_MS = 86400000;
function startOfDay(d){ const nd = new Date(d); nd.setHours(0,0,0,0); return nd; }
function daysBetween(a,b){ return Math.round((startOfDay(b) - startOfDay(a)) / DAY_MS); }
function isoDate(d){
  const nd = startOfDay(d);
  return nd.getFullYear() + '-' + String(nd.getMonth()+1).padStart(2,'0') + '-' + String(nd.getDate()).padStart(2,'0');
}
function fromIso(iso){ return new Date(iso + 'T00:00:00'); }
function ordinalSuffix(n){
  const j = n % 10, k = n % 100;
  if(j===1 && k!==11) return 'st';
  if(j===2 && k!==12) return 'nd';
  if(j===3 && k!==13) return 'rd';
  return 'th';
}
function formatShort(d){
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function formatButtonDate(d){
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function formatRangeLabel(d0, d6){
  const opts = { month:'short', day:'numeric' };
  return d0.toLocaleDateString('en-US', opts) + ' \u2013 ' + d6.toLocaleDateString('en-US', opts);
}

const DAY_LETTERS = ['M','T','W','T','F','S','S'];
function getWeekDates(today, weekOffset){
  const dow = today.getDay(); // 0 Sun .. 6 Sat
  const mondayOffset = (dow === 0) ? -6 : 1 - dow;
  const monday = startOfDay(new Date(today.getTime() + (mondayOffset + weekOffset*7) * DAY_MS));
  const days = [];
  for(let i=0;i<7;i++){ days.push(new Date(monday.getTime() + i*DAY_MS)); }
  return days;
}

/* ============================================================
   Cycle logic (relative to whichever date is selected)
   ============================================================ */
function getCycleInfo(data, referenceDate){
  const logs = (data.periodLogs || []).slice().sort();
  if(logs.length === 0) return null;

  const refIso = isoDate(referenceDate);
  const applicable = logs.filter(l => l <= refIso);
  const baseIso = applicable.length ? applicable[applicable.length - 1] : logs[0];
  const lastStart = fromIso(baseIso);
  const dayInCycle = daysBetween(lastStart, referenceDate) + 1;

  let cycleLength = 28;
  if(logs.length >= 2){
    const diffs = [];
    for(let i=1;i<logs.length;i++){
      diffs.push(daysBetween(fromIso(logs[i-1]), fromIso(logs[i])));
    }
    const avg = diffs.reduce((a,b)=>a+b,0) / diffs.length;
    if(avg >= 15 && avg <= 45) cycleLength = Math.round(avg);
  }

  const ovulationDay = Math.max(cycleLength - 14, 10);
  let phase;
  if(dayInCycle <= 7) phase = 'MENSTRUATION';
  else if(dayInCycle < ovulationDay) phase = 'FOLLICULAR';
  else if(dayInCycle <= ovulationDay + 2) phase = 'OVULATION';
  else phase = 'LUTEAL';

  return { dayInCycle, cycleLength, phase, lastStart: baseIso };
}

const PHASE_LABEL = {
  MENSTRUATION: 'MENSTRUATION',
  FOLLICULAR: 'FOLLICULAR PHASE',
  OVULATION: 'OVULATION',
  LUTEAL: 'LUTEAL PHASE',
};
const PHASE_FACE = {
  MENSTRUATION: 'cozy',
  FOLLICULAR: 'happy',
  OVULATION: 'heart-eyes',
  LUTEAL: 'sleepy',
};
const PHASE_FRIENDLY = {
  MENSTRUATION: 'your period',
  FOLLICULAR: 'the follicular phase',
  OVULATION: 'ovulation',
  LUTEAL: 'the luteal phase',
};

/* ============================================================

   ============================================================ */

  FOLLICULAR: ['Headache'],
  OVULATION: ['Bloating', 'Mood Swings'],
  LUTEAL: ['Mood Swings', 'Fatigue', 'Bloating', 'Headache'],

const INTENSITIES = [

  { id:'mid', label:'mid' },
  { id:'low', label:'low' },

/* ============================================================
   Onboarding (name -> profile picture -> last period date)
   ============================================================ */
function Onboarding({ onComplete }){

  const [name, setName] = useState('');
  const [avatarId, setAvatarId] = useState('');
  const [lastPeriod, setLastPeriod] = useState('');
  const todayIso = isoDate(new Date());

  return (
    <div className="onboarding">
      <div className="ob-dots">
        <div className={"ob-dot" + (step>=0 ? " filled" : "")}></div>
        <div className={"ob-dot" + (step>=1 ? " filled" : "")}></div>
        <div className={"ob-dot" + (step>=2 ? " filled" : "")}></div>
      </div>

      {step === 0 && (
        <React.Fragment>
          <p className="ob-eyebrow">Welcome to</p>
          <h1 className="ob-title">Flow State</h1>
          <p className="ob-sub">Let's set things up — just this once. What should I call you?</p>
          <input
            className="ob-input"
            type="text"
            placeholder="Your name"
            value={name}
            onChange={e=>setName(e.target.value)}
            autoFocus
          />
          <div className="ob-spacer"></div>
          <div className="ob-actions">
            <button
              className="ob-btn primary"
              disabled={!name.trim()}

            >Continue</button>
          </div>
        </React.Fragment>
      )}

      {step === 1 && (
        <React.Fragment>
          <p className="ob-eyebrow">Nice to meet you, {name.trim()}</p>
          <h1 className="ob-title">Pick your profile picture</h1>
          <p className="ob-sub">You can change this anytime later from the avatar menu.</p>
          <div className="avatar-grid">
            {AVATAR_OPTIONS.map(opt => (
              <button
                key={opt.id}
                className={"avatar-option" + (avatarId === opt.id ? " selected" : "")}
                onClick={()=>setAvatarId(opt.id)}
              >
                <img src={opt.src} alt={opt.label} />
              </button>
            ))}
          </div>
          <div className="ob-spacer"></div>
          <div className="ob-actions">
            <button className="ob-btn ghost" onClick={()=>setStep(0)}>Back</button>
            <button
              className="ob-btn primary"
              disabled={!avatarId}
              onClick={()=>setStep(2)}
            >Continue</button>
          </div>
        </React.Fragment>
      )}

      {step === 2 && (
        <React.Fragment>
          <p className="ob-eyebrow">Almost done</p>
          <h1 className="ob-title">When did your last period start?</h1>
          <p className="ob-sub">This helps Flow State work out your cycle day and phase. You won't be asked again.</p>
          <input
            className="ob-input"
            type="date"
            max={todayIso}
            value={lastPeriod}
            onChange={e=>setLastPeriod(e.target.value)}
          />
          <div className="ob-spacer"></div>
          <div className="ob-actions">
            <button className="ob-btn ghost" onClick={()=>setStep(1)}>Back</button>

              disabled={!lastPeriod}

          </div>
        </React.Fragment>
      )}

  );
}

/* ============================================================
   Week strip (with prev/next week navigation)
   ============================================================ */
function WeekStrip({ selectedIso, onSelect, loggedIsoSet, weekOffset, setWeekOffset }){
  const today = startOfDay(new Date());
  const todayIso = isoDate(today);
  const weekDates = useMemo(()=>getWeekDates(today, weekOffset), [weekOffset]);

  return (
    <div>
      <div className="week-nav-row">
        <button className="week-nav-btn" onClick={()=>setWeekOffset(o=>o-1)}>‹</button>
        <span className="week-range-label">
          {weekOffset === 0 ? 'This week' : formatRangeLabel(weekDates[0], weekDates[6])}
        </span>
        <button className="week-nav-btn" disabled={weekOffset >= 0} onClick={()=>setWeekOffset(o=>Math.min(0,o+1))}>›</button>
      </div>
      <div className="week-strip">
        {weekDates.map((d, i) => {
          const iso = isoDate(d);
          const isToday = iso === todayIso;
          const isSelected = iso === selectedIso;
          return (
            <button key={iso} className="day-col" onClick={()=>onSelect(iso)}>
              <span className={"day-letter" + (isToday ? " is-today" : "")}>
                {isToday ? 'Today' : DAY_LETTERS[i]}
              </span>
              <span className={"day-badge" + (isSelected ? " is-selected" : "") + (loggedIsoSet.has(iso) ? " has-log" : "")}>
                {String(d.getDate()).padStart(2,'0')}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   Add-symptom sheet
   ============================================================ */
function AddSymptomSheet({ existingCustom, initialName, onClose, onSave }){
  const [name, setName] = useState(initialName || '');
  const [customText, setCustomText] = useState('');
  const [intensity, setIntensity] = useState('');
  const allPresets = useMemo(()=>{
    const extra = existingCustom.filter(s => !PRESET_SYMPTOMS.includes(s));
    return [...PRESET_SYMPTOMS, ...extra];
  }, [existingCustom]);

  return (
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"></div>
        <div className="sheet-title-row">
          <h3 className="sheet-title">{initialName ? 'Confirm symptom' : 'Add symptom'}</h3>
          <button className="sheet-close" onClick={onClose}>✕</button>
        </div>

        <div className="field-label">Symptom</div>
        <div className="chip-row">
          {allPresets.map(s => (
            <button
              key={s}
              className={"chip" + (name === s ? " selected" : "")}
              onClick={()=>setName(s)}
            >{s}</button>
          ))}
        </div>
        <div className="custom-row">
          <input
            className="custom-input"
            placeholder="Or type your own..."
            value={customText}
            onChange={e=>setCustomText(e.target.value)}
          />
          <button
            className="custom-add"
            onClick={()=>{
              const trimmed = customText.trim();
              if(trimmed){ setName(trimmed); setCustomText(''); }
            }}
          >Use</button>
        </div>

        <div className="field-label">Intensity</div>
        <div className="intensity-chip-row">
          {INTENSITIES.map(opt => (
            <button
              key={opt.id}
              className={"intensity-chip" + (intensity === opt.id ? " selected" : "")}
              onClick={()=>setIntensity(opt.id)}
            >
              <span className={"dot " + opt.id}></span>
              <span>{opt.label}</span>
            </button>
          ))}
        </div>

        <button
          className="sheet-save"
          disabled={!name || !intensity}
          onClick={()=>{ if(name && intensity){ onSave(name, intensity); } }}
        >Save</button>
      </div>
    </div>
  );
}

/* ============================================================
   Period screen
   ============================================================ */
function PeriodScreen({ data, setData }){
  const todayIso = isoDate(new Date());
  const [selectedIso, setSelectedIso] = useState(todayIso);
  const [weekOffset, setWeekOffset] = useState(0);
  const [showAddSheet, setShowAddSheet] = useState(false);
  const [sheetPreset, setSheetPreset] = useState(null);
  const [showLogConfirm, setShowLogConfirm] = useState(false);

  const selectedDateObj = fromIso(selectedIso);
  const selectedIsToday = selectedIso === todayIso;

  const cycleInfo = useMemo(()=>getCycleInfo(data, selectedDateObj), [data, selectedIso]);
  const face = cycleInfo ? PHASE_FACE[cycleInfo.phase] : 'happy';

  const loggedIsoSet = useMemo(()=> new Set(data.periodLogs || []), [data.periodLogs]);
  const loggedSelected = loggedIsoSet.has(selectedIso);

  const symptomsForDay = (data.symptomLogs && data.symptomLogs[selectedIso]) || [];
  const allCustomSymptoms = data.customSymptoms || [];

  const predictedForPhase = cycleInfo ? (PHASE_PREDICTIONS[cycleInfo.phase] || []) : [];
  const loggedNamesLower = new Set(symptomsForDay.map(s => s.name.toLowerCase()));
  const predictedRemaining = predictedForPhase.filter(p => !loggedNamesLower.has(p.toLowerCase()));

  const { day, month, year } = { day: selectedDateObj.getDate(), month: selectedDateObj.toLocaleString('en-US',{month:'long'}), year: selectedDateObj.getFullYear() };

  function updateData(mutator){
    setData(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      mutator(next);
      saveData(next);
      return next;
    });
  }

  function handleLogPeriod(){
    updateData(next => {
      if(loggedSelected){
        next.periodLogs = (next.periodLogs || []).filter(d => d !== selectedIso);
      } else {
        next.periodLogs = [...(next.periodLogs || []), selectedIso];
      }
    });
    setShowLogConfirm(false);
  }

  function openAddSheet(preset){
    setSheetPreset(preset || null);
    setShowAddSheet(true);
  }
  function closeAddSheet(){
    setShowAddSheet(false);
    setSheetPreset(null);
  }

  function handleSaveSymptom(name, intensity){
    updateData(next => {
      if(!next.symptomLogs) next.symptomLogs = {};
      const dayList = next.symptomLogs[selectedIso] || [];
      const existingIdx = dayList.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
      if(existingIdx >= 0){
        dayList[existingIdx] = { ...dayList[existingIdx], intensity };
      } else {
        dayList.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, intensity });
      }
      next.symptomLogs[selectedIso] = dayList;

      if(!next.customSymptoms) next.customSymptoms = [];
      if(!PRESET_SYMPTOMS.includes(name) && !next.customSymptoms.includes(name)){
        next.customSymptoms.push(name);
      }
    });
    closeAddSheet();
  }

  function handleRemoveSymptom(id){
    updateData(next => {
      if(!next.symptomLogs || !next.symptomLogs[selectedIso]) return;
      next.symptomLogs[selectedIso] = next.symptomLogs[selectedIso].filter(s => s.id !== id);
    });
  }

  return (
    <React.Fragment>
      <div className="header-row">
        <h1 className="greeting">Hello, <b>{data.name}</b></h1>
        <AvatarButton data={data} setData={setData} />
      </div>

      <div className="date-line">
        {day}<sup>{ordinalSuffix(day)}</sup> {month}, {year}
      </div>

      <WeekStrip
        selectedIso={selectedIso}
        onSelect={setSelectedIso}
        loggedIsoSet={loggedIsoSet}
        weekOffset={weekOffset}
        setWeekOffset={setWeekOffset}
      />

      <div className="ring-wrap">
        {cycleInfo ? (
          <React.Fragment>
            <p className="ring-day">Day {cycleInfo.dayInCycle}</p>
            <p className="ring-phase">{PHASE_LABEL[cycleInfo.phase]}</p>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p className="ring-day">Day —</p>
            <p className="ring-phase">LOG YOUR FIRST PERIOD</p>
          </React.Fragment>
        )}
        <div className="blob-dock">
          <MoodBlob face={face} className="cs-blob" />
        </div>
      </div>

      <button
        className={"log-btn" + (loggedSelected ? " is-logged" : "")}
        onClick={()=>setShowLogConfirm(true)}
      >
        {loggedSelected
          ? (selectedIsToday ? 'Logged Today ✓' : 'Logged \u2713 ' + formatButtonDate(selectedDateObj))
          : (selectedIsToday ? 'Log Period' : 'Log Period for ' + formatButtonDate(selectedDateObj))}
      </button>

      {showLogConfirm && (
        <div className="confirm-box">
          <p>
            {loggedSelected
              ? ('Undo the period log for ' + formatShort(selectedDateObj) + '?')
              : ('Log period as started on ' + formatShort(selectedDateObj) + '?')}
          </p>
          <div className="confirm-actions">
            <button className="confirm-no" onClick={()=>setShowLogConfirm(false)}>Cancel</button>
            <button className="confirm-yes" onClick={handleLogPeriod}>{loggedSelected ? 'Undo' : 'Confirm'}</button>
          </div>
        </div>
      )}

      <div className="section-title">Symptoms</div>

      {predictedRemaining.length > 0 && (
        <React.Fragment>
          <p className="predicted-caption">Commonly felt during {PHASE_FRIENDLY[cycleInfo.phase]}</p>
          <div className="predicted-row">
            {predictedRemaining.map(name => (
              <button key={name} className="predicted-chip" onClick={()=>openAddSheet(name)}>
                <span className="predicted-plus">+</span>{name}
              </button>
            ))}
          </div>
        </React.Fragment>
      )}

      {symptomsForDay.length === 0 && predictedRemaining.length === 0 && (
        <div className="empty-state">
          <p>Nothing predicted or logged {selectedIsToday ? 'today' : 'for this day'}.</p>
          <span>Tap below if you're feeling anything</span>
        </div>
      )}

      {symptomsForDay.map(s => (
        <div className="symptom-card" key={s.id}>
          <span className="symptom-name">{s.name}</span>
          <span className="symptom-divider"></span>
          <span className="symptom-intensity">
            <span className={"dot " + s.intensity}></span>
            <span className="intensity-word">{s.intensity}</span>
          </span>
          <button className="remove-x" onClick={()=>handleRemoveSymptom(s.id)}>✕</button>
        </div>
      ))}

      <p className="ask-line">How are you feeling {selectedIsToday ? 'today' : 'on this day'}?</p>
      <button className="add-symptom-btn" onClick={()=>openAddSheet(null)}>+ Add symptom</button>

      {showAddSheet && (
        <AddSymptomSheet
          existingCustom={allCustomSymptoms}
          initialName={sheetPreset}
          onClose={closeAddSheet}
          onSave={handleSaveSymptom}
        />
      )}
    </React.Fragment>
  );
}

/* ============================================================
   Avatar + settings menu
   ============================================================ */
function AvatarButton({ data, setData }){
  const [open, setOpen] = useState(false);
  const current = AVATAR_OPTIONS.find(a => a.id === data.avatarId) || AVATAR_OPTIONS[0];

  function selectAvatar(id){
    setData(prev => {
      const next = { ...prev, avatarId: id };
      saveData(next);
      return next;
    });
  }

  return (
    <React.Fragment>
      <button className="avatar-btn" onClick={()=>setOpen(true)}>
        <img src={current.src} alt="Profile" className="avatar-img" />
      </button>
      {open && (
        <div className="avatar-menu-overlay" onClick={()=>setOpen(false)}>
          <div className="avatar-menu" onClick={e=>e.stopPropagation()}>
            <p className="avatar-menu-name">Hi, {data.name} 👋</p>
            <div className="avatar-menu-grid">
              {AVATAR_OPTIONS.map(opt => (
                <button
                  key={opt.id}
                  className={"avatar-menu-thumb" + (data.avatarId === opt.id ? " selected" : "")}
                  onClick={()=>selectAvatar(opt.id)}
                >
                  <img src={opt.src} alt={opt.label} />
                </button>
              ))}
            </div>
            <button
              className="danger"
              onClick={()=>{
                if(confirm('Reset all Flow State data on this device?')){
                  localStorage.removeItem(STORAGE_KEY);
                  setData(null);
                }
                setOpen(false);
              }}
            >Reset app data</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

   Coming soon placeholder (for tabs not yet built)

/* ============================================================
   Bottom nav
   ============================================================ */
function BottomNav({ active, onSelect }){
  return (
    <div className="bottom-nav">
      {TABS.map(t => (
        <button
          key={t.id}
          className={"nav-btn" + (active === t.id ? " active" : "")}
          onClick={()=>onSelect(t.id)}
        >
          <img src={t.icon} alt={t.label} className="nav-icon-img" />
        </button>
      ))}

/* ============================================================
   App root
   ============================================================ */
function App(){
  const [data, setData] = useState(()=>loadData());
  const [activeTab, setActiveTab] = useState('period');

  if(!data || !data.onboarded){
    return (
      <div className="app-shell">
        <Onboarding onComplete={(info)=>{
          const fresh = {
            name: info.name,
            avatarId: info.avatarId,
            onboarded: true,
            periodLogs: [info.lastPeriod],
            symptomLogs: {},
            customSymptoms: [],
          };
          saveData(fresh);
          setData(fresh);
        }} />
      </div>
    );
  }

  const activeMeta = TABS.find(t => t.id === activeTab);

  return (
    <div className="app-shell">
      <div className="screen">
        {activeTab === 'period' ? (
          <PeriodScreen data={data} setData={setData} />
        ) : (
          <ComingSoon label={activeMeta.label} />
        )}
      </div>
      <BottomNav active={activeTab} onSelect={setActiveTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
